[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "tianshu-platform-backend"
version = "0.1.0"
description = "Local platform origins and immutable model configuration service"
requires-python = ">=3.12"
dependencies = ["aiohttp==3.14.1", "jsonschema==4.26.0", "referencing==0.37.0"]

[project.optional-dependencies]
dev = ["ruff==0.15.7"]

[project.scripts]
tianshu-platform = "services.platform.__main__:main"

[tool.setuptools.packages.find]
include = ["services.platform*"]
namespaces = true

[tool.ruff]
target-version = "py312"
line-length = 100
