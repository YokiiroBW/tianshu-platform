[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "tianshu-platform-backend"
version = "0.1.0"
description = "Local platform origins and immutable model configuration service"
requires-python = ">=3.12"
dependencies = ["aiohttp==3.14.1", "jsonschema==4.26.0", "referencing==0.37.0", "cryptography==50.0.1", "yt-dlp==2026.8.19", "Pillow==12.3.0", "mutagen==1.48.1", "quickjs==1.19.4", "lxml==6.1.3", "cssselect==1.6.0", "jsonpath-ng==1.11.0", "hjson==3.1.0", "edge-tts==7.3.1"]

[project.optional-dependencies]
dev = ["ruff==0.15.7"]

[project.scripts]
tianshu-platform = "services.platform.__main__:main"

[tool.setuptools.packages.find]
include = ["services.platform*"]
namespaces = true

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["services/platform/media/books/_vendor"]

[tool.setuptools.package-data]
"services.platform.media.books._vendor" = ["SOURCE.json", "LICENSE.LegadoParser"]
"services.platform.media.books._vendor.LegadoParser2.RuleJs" = ["*.js"]

[tool.ruff.lint.per-file-ignores]
"services/platform/media/books/_vendor/**" = ["ALL"]
