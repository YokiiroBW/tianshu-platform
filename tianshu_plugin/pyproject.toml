[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "tianshu-plugin"
version = "1.0.0"
description = "Python authoring SDK for the TianShu plugin host"
requires-python = ">=3.12"
dependencies = []

[tool.setuptools]
packages = ["tianshu_plugin"]
package-dir = {tianshu_plugin = "."}

[tool.setuptools.package-data]
tianshu_plugin = ["*.js"]
